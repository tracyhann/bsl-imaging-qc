<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BSL QC Workflow Hub</title>
  <meta name="description" content="Central hub for BSL MRI and EEG QC workflow pages.">
  <style>
    :root {
      color-scheme: light;
      --ink: #14212b;
      --muted: #526575;
      --paper: #eef4f8;
      --surface: #ffffff;
      --line: #c7d7e4;
      --forest: #0b3551;
      --teal: #167b8f;
      --blue: #1167a8;
      --shadow: 0 24px 70px rgba(17, 45, 68, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(22, 123, 143, 0.18), transparent 31rem),
        radial-gradient(circle at 92% 8%, rgba(17, 103, 168, 0.18), transparent 28rem),
        linear-gradient(135deg, #f6fbfe 0%, #edf5fa 44%, #f8fbfd 100%);
      font-family: "IBM Plex Sans", "Aptos", "Helvetica Neue", "Segoe UI", Verdana, sans-serif;
      font-size: 18px;
      line-height: 1.7;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: 0.3;
      background-image:
        linear-gradient(rgba(17, 103, 168, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 103, 168, 0.07) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
    }

    a {
      color: var(--blue);
      font-weight: 800;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.2em;
    }

    .page {
      width: min(1320px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .shell {
      border: 1px solid rgba(199, 215, 228, 0.9);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .hub-header {
      padding: clamp(28px, 5vw, 58px);
      border-bottom: 1px solid rgba(199, 215, 228, 0.9);
      background:
        linear-gradient(160deg, rgba(22, 123, 143, 0.1), rgba(255, 255, 255, 0.86) 42%),
        rgba(255, 255, 255, 0.9);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      margin: 0 0 18px;
      border: 1px solid rgba(17, 103, 168, 0.18);
      border-radius: 999px;
      padding: 6px 11px;
      color: var(--forest);
      background: rgba(231, 242, 248, 0.86);
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: none;
      margin: 0;
      color: var(--forest);
      font-family: "IBM Plex Sans Condensed", "Aptos Display", "Helvetica Neue", sans-serif;
      font-size: clamp(3.2rem, 8vw, 6.9rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 1.1;
    }

    .lead {
      max-width: 78ch;
      margin: 22px 0 0;
      color: #334758;
      font-size: clamp(1.16rem, 1.8vw, 1.38rem);
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid rgba(199, 215, 228, 0.9);
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
    }

    .tab-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-button,
    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border: 1px solid var(--forest);
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    .tab-button {
      color: var(--forest);
      background: rgba(255, 255, 255, 0.65);
    }

    .tab-button[aria-selected="true"] {
      color: #fff;
      background: var(--forest);
      box-shadow: 0 12px 28px rgba(11, 53, 81, 0.2);
    }

    .open-link {
      color: var(--forest);
      background: rgba(231, 242, 248, 0.86);
    }

    .viewer {
      height: min(1120px, calc(100vh - 92px));
      min-height: 720px;
      background: var(--paper);
    }

    iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    iframe.active {
      display: block;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 1rem;
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 22px, 1320px);
        padding-top: 12px;
      }

      .shell {
        border-radius: 24px;
      }

      .tabs {
        position: static;
        align-items: flex-start;
        flex-direction: column;
      }

      .viewer {
        height: 820px;
        min-height: 640px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <header class="hub-header">
        <p class="eyebrow">BSL QC Workflows</p>
        <h1>QC Workflow Hub</h1>
        <p class="lead">A centralized static hub for reviewing the MRI and EEG QC workflows. Use the tabs to switch modalities without leaving the page, or open either workflow directly.</p>
      </header>

      <nav class="tabs" aria-label="QC modality tabs">
        <div class="tab-list" role="tablist" aria-label="Workflow modality">
          <button class="tab-button" id="tab-mri" type="button" role="tab" aria-selected="true" aria-controls="panel-mri" data-target="mri">MRI QC</button>
          <button class="tab-button" id="tab-eeg" type="button" role="tab" aria-selected="false" aria-controls="panel-eeg" data-target="eeg">EEG QC</button>
        </div>
        <a class="open-link" id="open-current" href="mri/index.html">Open Current Workflow</a>
      </nav>

      <main class="viewer">
        <iframe class="active" id="panel-mri" title="MRI QC Workflow" src="mri/index.html"></iframe>
        <iframe id="panel-eeg" title="EEG QC Workflow" src="eeg/index.html"></iframe>
      </main>
    </div>

  </div>

  <script>
    const tabs = Array.from(document.querySelectorAll(".tab-button"));
    const panels = {
      mri: document.getElementById("panel-mri"),
      eeg: document.getElementById("panel-eeg")
    };
    const openCurrent = document.getElementById("open-current");
    const hrefs = {
      mri: "mri/index.html",
      eeg: "eeg/index.html"
    };

    function activateTab(target) {
      tabs.forEach((tab) => {
        tab.setAttribute("aria-selected", String(tab.dataset.target === target));
      });
      Object.entries(panels).forEach(([name, panel]) => {
        panel.classList.toggle("active", name === target);
      });
      openCurrent.href = hrefs[target];
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => activateTab(tab.dataset.target));
    });
  </script>
</body>
</html>
